<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ChatNex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marketing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">✦</span><span>ChatNex</span></a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ url_for('index') }}#home">Home</a>
            <a href="{{ url_for('index') }}#about">About</a>
            <a href="{{ url_for('index') }}#services">Services</a>
            <a href="{{ url_for('index') }}#pricing">Pricing</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
        <div class="header-actions">
            <a class="text-link" href="{{ url_for('login') }}"></a>
            <a class="button button-small" href="{{ url_for('signup') }}">Create Account</a>
        </div>
        <button class="menu-toggle" aria-label="Open navigation">☰</button>
    </header>

    <main class="contact-shell">
        <section class="contact-hero">
            <span class="section-kicker">CONTACT</span>
            <h1>Let’s build smarter conversations.</h1>
            <p>Tell us what you want to automate, scale, or improve. We’ll help you map the right AI workflow.</p>
        </section>

        <section class="contact-grid">
            <div class="contact-card info-card">
                <h3>Get in touch</h3>
                <ul>
                    <li><strong>Email</strong><span>hello@chatnex.ai</span></li>
                    <li><strong>Phone</strong><span>+1 (415) 555-0192</span></li>
                    <li><strong>Office</strong><span>San Francisco, CA</span></li>
                </ul>
            </div>

            <div class="contact-card form-card">
                <form id="contactForm">
                    <div class="field-row">
                        <div>
                            <label for="name">Name</label>
                            <input id="name" type="text" placeholder="Your name" required>
                        </div>
                        <div>
                            <label for="company">Company</label>
                            <input id="company" type="text" placeholder="Company name">
                        </div>
                    </div>
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" required>
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Tell us about your project..." required></textarea>
                    <button class="button" type="submit">Send message <span></span></button>
                </form>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/marketing.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contactForm = document.getElementById("contactForm");
            if (!contactForm) return;

            contactForm.addEventListener("submit", (event) => {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const text = document.getElementById("message").value.trim();

                if (!name || !text) {
                    alert("Please enter your name and message.");
                    return;
                }

                const newFeedback = {
                    name: name,
                    text: text,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                };

                let feedbacks = JSON.parse(localStorage.getItem("chatnex_feedbacks")) || [];
                feedbacks.unshift(newFeedback);
                localStorage.setItem("chatnex_feedbacks", JSON.stringify(feedbacks));

                alert("Your message has been sent and added to feedback successfully!");
                contactForm.reset();
            });
        });
    </script>
</body>
</html>
